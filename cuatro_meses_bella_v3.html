function filmDraw(){let art=scenes[sceneIndex]?.art;if(!art)return;let cx=W/2,cy=H*.5,scale=Math.min(W/400,1.15);ctx.save();ctx.translate(cx,cy);ctx.scale(scale,scale);ctx.translate(-cx,-cy);ctx.globalAlpha=.95;ctx.fillStyle='#e6d4a333';ctx.fillRect(0,H*.69,W,2);if(['walk','routine','guitar'].includes(art)){boy(cx,cy,1);if(art==='walk'){for(let i=-2;i<=2;i++)rounded(cx+i*90-23,cy+95,48,5,2,'#ffffff24')}if(art==='routine'){rounded(cx-125,cy-145,80,80,8,'#e8d4a530');ctx.font='45px sans-serif';ctx.fillStyle='#f3d9a9';ctx.fillText('▤',cx-107,cy-87);ctx.strokeStyle='#e7c38d';ctx.lineWidth=8;ctx.beginPath();ctx.moveTo(cx+45,cy+20);ctx.lineTo(cx+115,cy+20);ctx.stroke();ctx.fillStyle='#d3a66f';ctx.fillRect(cx+107,cy+3,13,34)}if(art==='guitar'){ctx.save();ctx.translate(cx+20,cy-9);ctx.rotate(-.3+Math.sin(now*.008)*.04);ctx.fillStyle='#c48a51';ctx.beginPath();ctx.ellipse(0,0,28,21,0,0,7);ctx.fill();ctx.strokeStyle='#e9cf9b';ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(8,-5);ctx.lineTo(75,-18);ctx.stroke();ctx.restore()}}else if(art==='cat'){boy(cx-75,cy,1,true);kitty(cx+80,cy+25,.95)}else if(art==='call'||art==='call2'){rounded(cx-160,cy+30,320,65,20,'#263346','#bca47a');rounded(cx-140,cy-30,280,80,20,'#8395a650','#f0d6ab55');boy(cx-72,cy+14,.75);boy(cx+60,cy+14,.75);rounded(cx-38,cy-137,76,98,18,'#18263b','#d9b77c');ctx.font='38px sans-serif';ctx.textAlign='center';ctx.fillStyle='#e7c78e';ctx.fillText('♫',cx,cy-73);if(art==='call2'){ctx.strokeStyle='#f7d9a9';ctx.lineWidth=3;ctx.beginPath();ctx.arc(cx,cy-86,64,-.3,1.1);ctx.stroke()}}else if(art==='phone'){rounded(cx-100,cy-150,200,295,26,'#17243a','#dfbd83');rounded(cx-79,cy-119,158,50,12,'#dfc5a8');ctx.fillStyle='#453a49';ctx.font='bold 16px sans-serif';ctx.textAlign='center';ctx.fillText('Una nota…',cx,cy-87);rounded(cx-53,cy-44,127,48,12,'#a8c1d9');rounded(cx-73,cy+24,122,48,12,'#f0d7b0');ctx.fillStyle='#ffe7af';ctx.font='16px sans-serif';ctx.fillText('03:00 a. m.',cx,cy+118)}else if(art==='library'||art==='study'){for(let i=-2;i<=2;i++){rounded(cx+i*67-24,cy-155,51,135,4,'#a9856570');for(let j=0;j<5;j++)rounded(cx+i*67-20,cy-145+j*25,43,16,1,j%2?'#dbbc8c':'#b6c6c5')}rounded(cx-100,cy+35,200,15,6,'#bd9878');boy(cx,cy+20,.9);if(art==='study'){ctx.fillStyle='#f5e8ce';ctx.fillRect(cx-63,cy+48,126,55);ctx.fillStyle='#655b58';ctx.font='15px monospace';ctx.fillText('H₂O + ?',cx-43,cy+77)}}else if(art==='clock'){ctx.strokeStyle='#f5d59d';ctx.lineWidth=7;ctx.beginPath();ctx.arc(cx,cy,105,0,7);ctx.stroke();ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(cx-40,cy-49);ctx.moveTo(cx,cy);ctx.lineTo(cx+63,cy-10);ctx.stroke();ctx.font='bold 23px sans-serif';ctx.textAlign='center';ctx.fillStyle='#fff1ce';ctx.fillText('12:26',cx,cy+150)}else if(art==='four'){ctx.font='bold 165px Georgia';ctx.textAlign='center';ctx.fillStyle='#f3d8a3';ctx.fillText('4',cx,cy+55);ctx.font='22px Georgia';ctx.fillText('MESES',cx,cy+100)}ctx.restore()}
function gardenDraw(){let cx=W*.5,cy=H*.58,rad=Math.min(W*.36,180);for(let i=0;i<garden;i++){let a=-Math.PI/2+i*Math.PI*2/8+now*.00004,x=cx+Math.cos(a)*rad,y=cy+Math.sin(a)*rad*.72;ctx.strokeStyle='#f8d99c88';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(cx,cy);ctx.quadraticCurveTo(cx+Math.cos(a+1)*60,cy+Math.sin(a+1)*60,x,y);ctx.stroke();for(let j=0;j<6;j++){let b=j*Math.PI/3+now*.0002;ctx.fillStyle=['#eec995','#f1b6ca','#b9d4c3'][i%3];ctx.beginPath();ctx.ellipse(x+Math.cos(b)*10,y+Math.sin(b)*10,7,4,b,0,7);ctx.fill()}ctx.fillStyle='#fff2d3';ctx.beginPath();ctx.arc(x,y,4,0,7);ctx.fill()}ctx.fillStyle='#ffdfac';ctx.beginPath();ctx.arc(cx,cy,13+Math.sin(now*.003)*3,0,7);ctx.fill()}

function frame(ts){now=ts;bg();if(mode==='film'){let elapsed=ts-filmStart,acc=0,index=scenes.length;for(let i=0;i<scenes.length;i++){acc+=scenes[i].duration;if(elapsed<acc){index=i;break}}if(index===scenes.length){letter()}else{updateScene(index);filmDraw();progress.style.width=`${Math.min(100,elapsed/total*100)}%`}}else if(mode==='garden')gardenDraw();else if(['roomIntro','room'].includes(mode)){kitty(W*.5,H*.78,.65)}requestAnimationFrame(frame)}requestAnimationFrame(frame);
function playNote(){if(muted||!audioCtx)return;let notes=[261.63,329.63,392,523.25,493.88,392,329.63,293.66,261.63,349.23,440,392,329.63,293.66,261.63,196],freq=notes[notesPlayed++%notes.length],at=audioCtx.currentTime;for(let j=0;j<2;j++){let osc=audioCtx.createOscillator(),gain=audioCtx.createGain(),filter=audioCtx.createBiquadFilter();osc.type='sine';osc.frequency.value=freq*(j===0?1:.5);filter.type='lowpass';filter.frequency.value=1400;gain.gain.setValueAtTime(.0001,at);gain.gain.exponentialRampToValueAtTime(j===0?.045:.015,at+.025);gain.gain.exponentialRampToValueAtTime(.0001,at+1.25);osc.connect(filter);filter.connect(gain);gain.connect(audioCtx.destination);osc.start(at);osc.stop(at+1.3)}}function toggleMusic(){if(muted){try{let AC=window.AudioContext||window.webkitAudioContext;audioCtx=audioCtx||new AC();audioCtx.resume();muted=false;$('audio').textContent='♫ Piano encendido';playNote();musicInterval=setInterval(playNote,480)}catch(e){$('audio').textContent='Audio no disponible'}}else{muted=true;clearInterval(musicInterval);$('audio').textContent='♫ Activar piano'}}function startMusic(){if(muted)toggleMusic()}$('audio').onclick=toggleMusic;intro();})();
